{% extends 'base.html' %}
{% block content %}
    <header class="topbar">
        <div class="topbar-left">
            <h1>Settings</h1>
            <p>Capture and detection behavior. Changes are saved to config.json.</p>
        </div>
    </header>

    <section class="card">
        <div class="card-body" style="padding: 24px;">
            <form id="settingsForm" class="form-grid">
                <label>Capture interface
                    <input name="interface" list="ifaceList" value="{{ config.interface }}" required>
                    <datalist id="ifaceList"></datalist>
                </label>
                <label>BPF capture filter (optional)
                    <input name="capture_bpf" value="{{ config.capture_bpf or '' }}" placeholder="e.g. not port 22">
                </label>
                <label>Sampling rate (1 = every connection, 4 = one in four)
                    <input name="sampling_rate" type="number" min="1" value="{{ config.sampling_rate or 1 }}">
                </label>
                <label>Match threshold (0.5 to 1.0)
                    <input name="match_threshold" type="number" step="0.01" min="0.5" max="1" value="{{ config.detection.match_threshold }}">
                </label>
                <label>Half-open connections needed to call a SYN flood
                    <input name="half_open_min_count" type="number" min="1" value="{{ config.detection.half_open_min_count }}">
                </label>
                <label>Alert grouping window (seconds)
                    <input name="alert_cooldown_seconds" type="number" min="0" value="{{ config.detection.alert_cooldown_seconds }}">
                </label>
                <label>Reverse DNS lookups
                    <select name="reverse_dns">
                        {% for mode, text in [('off', 'Off'), ('private', 'Internal addresses only'), ('all', 'All addresses')] %}
                        <option value="{{ mode }}" {% if config.reverse_dns == mode %}selected{% endif %}>{{ text }}</option>
                        {% endfor %}
                    </select>
                </label>
                <div>
                    <button class="btn btn-success" type="submit">Save settings</button>
                    <p id="settingsMsg" role="status"></p>
                </div>
            </form>
        </div>
    </section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/settings.js') }}"></script>
{% endblock %}
