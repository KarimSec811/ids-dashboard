{% extends 'base.html' %}
{% block content %}
    <header class="topbar">
        <div class="topbar-left">
            <h1>Alerts</h1>
            <p>Detected attacks. Repeated detections of the same attack are grouped into one alert.</p>
        </div>
        <div class="top-actions">
            <button id="loadHistoryBtn" class="btn btn-secondary">Load history</button>
        </div>
    </header>

    <section class="card">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Source</th>
                        <th>Destination</th>
                        <th>Type</th>
                        <th>Severity</th>
                        <th>Confidence</th>
                        <th>Events</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="alertsTableBody"></tbody>
            </table>
        </div>
    </section>
{% endblock %}
