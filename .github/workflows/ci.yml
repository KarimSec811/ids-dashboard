name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get install -y tshark
      - run: pip install -r requirements.txt
      - run: python tests/make_pcaps.py

      # Ubuntu 25.04+ ships an AppArmor profile that confines tshark and
      # blocks it from reading files under the runner workspace. Grant read
      # access to the workspace so the PCAP-based tests can run.
      - name: Allow tshark AppArmor (Ubuntu 25.04+)
        if: runner.os == 'Linux'
        run: |
          if [ -f /etc/apparmor.d/tshark ]; then
            echo "file rw ${GITHUB_WORKSPACE}/**," | sudo tee -a /etc/apparmor.d/local/tshark
            echo "file rw /tmp/**,"                | sudo tee -a /etc/apparmor.d/local/tshark
            echo "file rw ${RUNNER_TEMP}/**,"      | sudo tee -a /etc/apparmor.d/local/tshark
            sudo apparmor_parser -r /etc/apparmor.d/tshark
          fi

      - run: pytest tests/ -q
